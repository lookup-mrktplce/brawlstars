<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Brawl Stars 2D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Загрузка -->
  <div id="loading-screen">
    <div id="loading-bar-container"><div id="loading-bar"></div></div>
    <div id="loading-text">Загрузка: 0%</div>
  </div>

  <!-- Главное меню -->
  <div id="main-menu" class="hidden">
    <div class="menu-left">
      <button id="btn-shop">🛒 Магазин</button>
      <button id="btn-brawlers">🥊 Бойцы</button>
    </div>
    <div class="menu-center">
      <img id="menu-brawler-img" alt="Brawler">
      <div id="brawler-level">Уровень: 0</div>
      <div id="brawler-name">Shelly</div>
    </div>
    <div class="menu-right">
      <button id="btn-play">▶ Играть</button>
    </div>
  </div>

  <!-- Игровой холст -->
  <canvas id="game-canvas"></canvas>

  <!-- Интерфейс игры -->
  <div id="game-ui" class="hidden">
    <div id="ui-top">
      <div id="hp-bar-container"><div id="hp-bar"></div></div>
      <div id="ammo-container"></div>
    </div>
    <div id="score-display">🔵 Синие: 0 | 🔴 Красные: 0</div>
    <div id="win-screen" class="hidden">
      <h1 id="win-text">ПОБЕДА!</h1>
      <button id="btn-menu">В главное меню</button>
    </div>
    <div id="joysticks">
      <div id="move-joystick" class="joystick"><div class="knob"></div></div>
      <div id="attack-joystick" class="joystick"><div class="knob"></div></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
