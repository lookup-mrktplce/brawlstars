<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viosell</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --card: #fff; --text: #0f172a; --error: #ef4444; --success: #22c55e; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: var(--card); padding: 2rem; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
    h1 { text-align: center; margin: 0 0 1.5rem; color: var(--primary); font-size: 1.8rem; }
    input { width: 100%; padding: 0.9rem; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; margin-bottom: 0.8rem; box-sizing: border-box; transition: 0.2s; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    button { width: 100%; padding: 0.9rem; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; margin-top: 0.4rem; transition: 0.2s; font-weight: 500; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-google { background: #fff; color: #333; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-small { padding: 0.5rem; font-size: 0.85rem; margin-top: 0.5rem; }
    .hidden { display: none !important; }
    .status { margin-top: 1rem; padding: 0.8rem; border-radius: 10px; text-align: center; font-size: 0.9rem; animation: fadeIn 0.3s; }
    .status.success { background: #dcfce7; color: #15803d; }
    .status.error { background: #fee2e2; color: #b91c1c; }
    .divider { display: flex; align-items: center; margin: 1.2rem 0; color: #94a3b8; font-size: 0.85rem; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }
    .divider span { padding: 0 12px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛒 Viosell</h1>

    <!-- ФОРМА АВТОРИЗАЦИИ -->
    <div id="auth-section">
      <input type="email" id="email" placeholder="Email" autocomplete="email">
      <input type="password" id="password" placeholder="Пароль (мин. 6 символов)" autocomplete="current-password">
      
      <button id="btn-register" class="btn-primary">Зарегистрироваться</button>
      <button id="btn-login" class="btn-secondary">Войти</button>

      <div class="divider"><span>или</span></div>

      <button id="btn-google" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z"/></svg>
        Войти через Google
      </button>

      <div id="auth-status" class="status hidden"></div>
    </div>

    <!-- ЛИЧНЫЙ КАБИНЕТ (после входа) -->
    <div id="dashboard-section" class="hidden">
      <p style="text-align:center; margin-bottom:1rem;">✅ Вы вошли как: <b id="user-email"></b></p>
      
      <!-- Предупреждение о неподтверждённой почте + кнопка повторной отправки -->
      <div id="verify-block" class="hidden" style="background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; padding:0.8rem; margin-bottom:1rem;">
        <p style="color:#c2410c; font-size:0.9rem; margin:0 0 0.5rem;">⚠️ Подтвердите почту, чтобы получить полный доступ.</p>
        <button id="btn-resend" class="btn-secondary btn-small">Отправить письмо ещё раз</button>
      </div>

      <button id="btn-logout" class="btn-secondary">Выйти</button>
      <hr style="border:0; border-top:1px solid #e2e8f0; margin:1.2rem 0;">
      <p style="color:#64748b; text-align:center;">📦 Раздел создания объявлений подключим следующим шагом.</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendEmailVerification, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDESE8nQzP2iF0YKVexxqRJ6kWoLjDmHw8",
      authDomain: "exzzy1-84d88.firebaseapp.com",
      projectId: "exzzy1-84d88",
      storageBucket: "exzzy1-84d88.firebasestorage.app",
      messagingSenderId: "892085705947",
      appId: "1:892085705947:web:bbbd44ebc1cf460bdbc0fe",
      measurementId: "G-ZRPGRHES04"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const authSection = document.getElementById('auth-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const statusEl = document.getElementById('auth-status');
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const verifyBlock = document.getElementById('verify-block');

    function showStatus(msg, type = 'error') {
      statusEl.textContent = msg;
      statusEl.className = `status ${type}`;
      statusEl.classList.remove('hidden');
      setTimeout(() => statusEl.classList.add('hidden'), 5000);
    }

    // 🔁 Функция отправки письма подтверждения
    async function resendVerificationEmail() {
      const user = auth.currentUser;
      if (!user) return;
      try {
        await sendEmailVerification(user);
        showStatus('📧 Письмо отправлено! Проверь почту и спам.', 'success');
      } catch (e) {
        console.error('Resend error:', e);
        // Частые ошибки и подсказки
        if (e.code === 'auth/too-many-requests') {
          showStatus('⏳ Слишком много запросов. Подожди 1-2 минуты.', 'error');
        } else {
          showStatus('❌ Не удалось отправить письмо. Попробуй позже.', 'error');
        }
      }
    }

    // Регистрация с улучшенной обработкой
    document.getElementById('btn-register').onclick = async () => {
      const email = emailInput.value.trim();
      const pass = passInput.value;
      if (!email || pass.length < 6) return showStatus('Введите email и пароль (мин. 6 символов)');
      
      statusEl.textContent = '⏳ Создаём аккаунт...';
      statusEl.className = 'status';
      statusEl.classList.remove('hidden');

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        
        // Пытаемся отправить письмо, но НЕ блокируем, если не вышло
        try {
          await sendEmailVerification(cred.user);
          showStatus('📧 Письмо отправлено! Проверь почту (и спам).', 'success');
        } catch (emailErr) {
          console.warn('Письмо не отправлено:', emailErr.code);
          showStatus('✅ Аккаунт создан! Письмо может задержаться — проверь спам или нажми "Отправить ещё раз" в личном кабинете.', 'success');
        }
        emailInput.value = passInput.value = '';
      } catch (e) {
        const msg = e.code?.includes('email-already-in-use') ? 'Email уже зарегистрирован' :
                    e.code?.includes('weak-password') ? 'Пароль должен быть длиннее 6 символов' :
                    e.code?.includes('invalid-email') ? 'Некорректный email' :
                    e.code?.replace('auth/', '').replace(/-/g, ' ') || 'Ошибка регистрации';
        showStatus('❌ ' + msg);
      }
    };

    // Вход
    document.getElementById('btn-login').onclick = async () => {
      const email = emailInput.value.trim();
      const pass = passInput.value;
      if (!email || !pass) return showStatus('Заполните все поля');
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        const msg = e.code?.includes('user-not-found') ? 'Аккаунт не найден' :
                    e.code?.includes('wrong-password') ? 'Неверный пароль' :
                    e.code?.replace('auth/', '').replace(/-/g, ' ') || 'Ошибка входа';
        showStatus('❌ ' + msg);
      }
    };

    // Google вход
    document.getElementById('btn-google').onclick = async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (e) {
        showStatus('❌ ' + (e.code?.replace('auth/', '').replace(/-/g, ' ') || 'Ошибка Google входа'));
      }
    };

    // Выход
    document.getElementById('btn-logout').onclick = () => signOut(auth);
    
    // Повторная отправка письма
    document.getElementById('btn-resend').onclick = resendVerificationEmail;

    // Отслеживание состояния авторизации
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('user-email').textContent = user.email;
        authSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        
        // Показываем блок с предупреждением ТОЛЬКО если почта не подтверждена
        verifyBlock.classList.toggle('hidden', user.emailVerified);
      } else {
        authSection.classList.remove('hidden');
        dashboardSection.classList.add('hidden');
        verifyBlock.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
