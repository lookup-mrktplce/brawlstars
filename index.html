<!DOCTYPE html>
<html>
<head>
    <title>Brawl Stars HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen">
        <h1>BRAWL CLONE</h1>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <p id="loading-text">0%</p>
    </div>

    <div id="main-menu">
        <div class="top-bar">
            <div class="currency">🟡 9999</div>
            <div class="currency">💎 50</div>
        </div>
        <button style="position:absolute; bottom:50px; right:50px; padding:20px 60px; font-size:30px; background:#ffcc00; border-radius:15px; border:none; cursor:pointer;" onclick="startBattle()">ИГРАТЬ</button>
    </div>

    <div id="battle-screen" style="display:none;">
        <div id="battle-ui">
            <div style="color:#3498db">СИНИЕ: <span id="blue-gems">0</span></div>
            <div style="color:#e74c3c">КРАСНЫЕ: <span id="red-gems">0</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="controls">
            <div id="move-zone" class="joystick-zone"><div class="joystick-base"><div id="move-stick" class="stick"></div></div></div>
            <div id="attack-zone" class="joystick-zone"><div class="joystick-base"><div id="attack-stick" class="stick"></div></div></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
